name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM and Ninja
        shell: pwsh
        run: |
          choco install llvm ninja -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B out/lcs-clang -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_LINKER="C:/Program Files/LLVM/bin/lld-link.exe" `
            -DCMAKE_RC_COMPILER="C:/Program Files/LLVM/bin/llvm-rc.exe"

      - name: Build LCSNative
        shell: pwsh
        run: ninja -C out/lcs-clang LCSNative

      - name: Build host menu test
        shell: pwsh
        run: ninja -C out/lcs-clang lcs_host_menu_test

      - name: Run host menu test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out -Recurse -Filter lcs_host_menu_test.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "lcs_host_menu_test.exe not found under out/" }
          Write-Host "running $($exe.FullName)"
          & $exe.FullName
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LCSNative-windows
          path: |
            out/**/LCSNative.exe
            out/**/*.dll
          if-no-files-found: warn
